name: Add custom vocabulary

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  add-word:
    if: github.actor == github.repository_owner && github.event.issue.title == '[VLASTNI] Přidat slovíčko'
    runs-on: ubuntu-latest
    steps:
      - name: Validate and save word
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            const match = body.match(/<!-- CUSTOM_WORD_JSON\s*([\s\S]*?)\s*-->/);
            if (!match) core.setFailed('Missing CUSTOM_WORD_JSON payload');
            if (!match) return;

            let input;
            try { input = JSON.parse(match[1]); }
            catch (error) { core.setFailed('Invalid JSON payload'); return; }

            const clean = value => String(value || '').trim();
            const allowedTypes = new Set(['noun','verb','adjective','number']);
            const word = {
              profileKey: clean(input.profileKey).slice(0, 50),
              en: clean(input.en).slice(0, 100),
              cs: clean(input.cs).slice(0, 100),
              emoji: clean(input.emoji).slice(0, 20),
              category: clean(input.category || 'Vlastní').slice(0, 60),
              type: allowedTypes.has(input.type) ? input.type : 'noun',
              unit: 'Vlastní'
            };
            if (!/^[a-z0-9-]+$/.test(word.profileKey) || !word.en || !word.cs) {
              core.setFailed('Invalid profile or word data');
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'custom-words.json';
            let current = [];
            let sha;
            try {
              const response = await github.rest.repos.getContent({owner,repo,path,ref:'main'});
              sha = response.data.sha;
              current = JSON.parse(Buffer.from(response.data.content,'base64').toString('utf8'));
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            const index = current.findIndex(item =>
              item.profileKey === word.profileKey &&
              String(item.en).toLowerCase() === word.en.toLowerCase()
            );
            if (index >= 0) word.id = current[index].id;
            else word.id = 'shared_' + word.profileKey + '_' + Date.now();
            if (index >= 0) current[index] = word;
            else current.push(word);

            await github.rest.repos.createOrUpdateFileContents({
              owner,repo,path,branch:'main',sha,
              message: 'Přidat vlastní slovíčko ' + word.en + ' pro ' + word.profileKey,
              content: Buffer.from(JSON.stringify(current,null,2) + '\n').toString('base64')
            });
            await github.rest.issues.createComment({
              owner,repo,issue_number:context.issue.number,
              body:'✅ Slovíčko **' + word.en + '** bylo uloženo pro profil **' + word.profileKey + '**.'
            });
            await github.rest.issues.update({
              owner,repo,issue_number:context.issue.number,state:'closed'
            });
